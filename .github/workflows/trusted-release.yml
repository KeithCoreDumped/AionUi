name: Trusted Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'macos-arm64'
        type: choice
        options:
          - linux-x64
          - linux-arm64
          - macos-arm64
          - macos-x64
          - windows-x64
          - windows-arm64
          - all
      publish_release:
        description: 'Publish a public GitHub Release (macos-arm64 only for manual runs)'
        required: true
        default: false
        type: boolean
      release_tag:
        description: 'Release tag; manual publish must match package.json version (for example v2.2.2)'
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: trusted-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'
  AIONUI_TRUSTED_BUILD: '1'
  AIONUI_HUB_TAG: 'dist-ebc6a2b'

jobs:
  policy:
    name: Trusted build policy
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      aioncore_revision: ${{ steps.lock.outputs.revision }}
      aioncore_repository: ${{ steps.lock.outputs.repository }}
      aioncore_version: ${{ steps.lock.outputs.version }}
      node_version: ${{ steps.tools.outputs.node }}
      bun_version: ${{ steps.tools.outputs.bun }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Reject telemetry secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: |
          set -euo pipefail
          if [ -n "${SENTRY_DSN:-}" ] || [ -n "${VITE_SENTRY_DSN:-}" ]; then
            echo '::error::SENTRY_DSN/VITE_SENTRY_DSN must not be configured for trusted release'
            exit 1
          fi

      - name: Verify tag points at this commit
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          TAG_SHA=$(git rev-list -n 1 "$GITHUB_REF")
          HEAD_SHA=$(git rev-parse HEAD)
          echo "tag=$GITHUB_REF_NAME sha=$TAG_SHA head=$HEAD_SHA"
          test "$TAG_SHA" = "$HEAD_SHA"

      - name: Read lock and tool versions
        id: lock
        run: |
          node -e '
            const fs = require("fs");
            const lock = JSON.parse(fs.readFileSync(".github/aioncore.lock", "utf8"));
            const tools = require("./.github/trusted/tool-versions.json");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `revision=${lock.revision}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `repository=${lock.repository.replace(/\.git$/, "").replace("https://github.com/","")}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${lock.upstreamVersion}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `node=${tools.node}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `bun=${tools.bun}\n`);
          '

      - name: Read pinned tool versions
        id: tools
        run: |
          echo "node=${{ steps.lock.outputs.node }}" >> "$GITHUB_OUTPUT"
          echo "bun=${{ steps.lock.outputs.bun }}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.lock.outputs.node }}

      - name: Verify trusted-build policy
        run: node .github/trusted/verify-trusted-build.js

      - name: Validate manual release request
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SELECTED_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          test "$SELECTED_PLATFORM" = 'macos-arm64'
          test "$RELEASE_TAG" = "$EXPECTED_TAG"

      - name: Select matrix
        id: matrix
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PLATFORM='${{ inputs.platform }}'
          else
            PLATFORM='all'
          fi
          MATRIX=$(node .github/trusted/release-matrix.js "$PLATFORM")
          {
            echo 'matrix<<EOF'
            echo "$MATRIX"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  quality:
    name: Lint, types, tests
    runs-on: ubuntu-22.04
    needs: policy
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ needs.policy.outputs.node_version }}

      - name: Setup bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ needs.policy.outputs.bun_version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Postinstall
        run: bun run postinstall

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun run test

  build:
    name: Build ${{ matrix.platform }}
    needs: [policy, quality]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.policy.outputs.matrix) }}
    steps:
      - name: Checkout AionUi
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Checkout AionCore
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ needs.policy.outputs.aioncore_repository }}
          ref: ${{ needs.policy.outputs.aioncore_revision }}
          path: .aioncore-src
          persist-credentials: false

      - name: Reject AionCore telemetry endpoints
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'ingest\.sentry\.io' .aioncore-src --include='*.rs' --include='*.toml' --include='*.json' | grep -v '/target/' ; then
            echo '::error::AionCore source contains a Sentry endpoint'
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ needs.policy.outputs.node_version }}

      - name: Setup bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: ${{ needs.policy.outputs.bun_version }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          if [ "${{ matrix.platform }}" = "macos-x64" ]; then
            rustup target add x86_64-apple-darwin
          fi
          rustc --version
          cargo --version

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 pkg-config libsqlite3-dev fakeroot dpkg-dev rpm libnss3-dev libatk-bridge2.0-dev libdrm2 libxkbcommon-dev libxss1 libatspi2.0-dev libgtk-3-dev libxrandr2 libasound2-dev

      - name: Setup MSBuild
        if: startsWith(matrix.platform, 'windows')
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0
        with:
          vs-version: '17.0'

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild native modules
        if: ${{ !startsWith(matrix.platform, 'windows') }}
        run: bunx electron-builder install-app-deps
        env:
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers

      - name: Build AionCore from locked source
        shell: bash
        env:
          AIONCORE_SOURCE_DIR: ${{ github.workspace }}/.aioncore-src
          AIONUI_BACKEND_ARCH: ${{ matrix.arch }}
          AIONUI_BACKEND_PLATFORM: ${{ matrix.electron_platform }}
        run: node .github/trusted/build-aioncore-from-source.js

      - name: Cargo metadata for SBOM
        shell: bash
        run: cargo metadata --locked --format-version 1 --manifest-path .aioncore-src/crates/aionui-app/Cargo.toml > aioncore-cargo-metadata.json

      - name: Package with upstream electron-builder
        shell: bash
        env:
          AIONUI_TRUSTED_BUILD: '1'
          AIONUI_BACKEND_ARCH: ${{ matrix.arch }}
          AIONUI_HUB_TAG: dist-ebc6a2b
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=8192'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          if [ "${{ matrix.electron_platform }}" = "win32" ]; then
            export AIONUI_BACKEND_LOCAL_BINARY="${GITHUB_WORKSPACE}/.aioncore-build/${{ matrix.electron_platform }}-${{ matrix.arch }}/aioncore.exe"
          else
            export AIONUI_BACKEND_LOCAL_BINARY="${GITHUB_WORKSPACE}/.aioncore-build/${{ matrix.electron_platform }}-${{ matrix.arch }}/aioncore"
          fi
          test -f "$AIONUI_BACKEND_LOCAL_BINARY"
          ${{ matrix.command }}

      - name: Verify bundled AionCore
        shell: bash
        run: |
          set -euo pipefail
          KEY="${{ matrix.electron_platform }}-${{ matrix.arch }}"
          BIN_NAME="aioncore"
          if [ "${{ matrix.electron_platform }}" = "win32" ]; then BIN_NAME="aioncore.exe"; fi
          BIN=$(find out -type f -path "*/bundled-aioncore/${KEY}/${BIN_NAME}" | head -n 1 || true)
          test -n "$BIN"
          echo "Found $BIN"
          if [ "${{ matrix.electron_platform }}" != "win32" ]; then
            test -x "$BIN"
            "$BIN" --help >/tmp/aioncore-help.txt || true
            head /tmp/aioncore-help.txt
          fi
          node .github/trusted/verify-trusted-build.js

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            out/*.exe
            out/*.msi
            out/*.dmg
            out/*.deb
            out/AionUi-*-mac-*.zip
            out/*.yml
            aioncore-cargo-metadata.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Provenance and GitHub Release
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: [policy, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment: release
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ needs.policy.outputs.node_version }}

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: build-artifacts

      - name: Prepare release assets
        env:
          RELEASE_PROFILE: ${{ github.event_name == 'workflow_dispatch' && 'trusted-macos-arm64' || 'trusted-desktop' }}
        run: bash scripts/prepare-release-assets.sh build-artifacts release-assets "$RELEASE_PROFILE"

      - name: Merge cargo metadata if present
        run: |
          set -euo pipefail
          META=$(find build-artifacts -name 'aioncore-cargo-metadata.json' | head -n 1 || true)
          if [ -n "$META" ]; then
            cp "$META" aioncore-cargo-metadata.json
            echo "AIONCORE_CARGO_METADATA=$PWD/aioncore-cargo-metadata.json" >> "$GITHUB_ENV"
          fi

      - name: Generate provenance
        env:
          AIONUI_GIT_SHA: ${{ github.sha }}
          AIONUI_GIT_TAG: ${{ env.RELEASE_TAG }}
          AIONUI_BUILD_PLATFORM: 'github-actions-matrix'
        run: node .github/trusted/generate-provenance.js release-assets release-assets

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'release-assets/*'

      - name: Write trusted release notes
        env:
          AIONCORE_REV: ${{ needs.policy.outputs.aioncore_revision }}
          AIONCORE_VER: ${{ needs.policy.outputs.aioncore_version }}
        run: |
          cat > trusted-notes.md <<EOF
          ## Trusted Build

          - Telemetry / Sentry / official auto-update: **disabled** (compile-time)
          - AionUi commit: \`${GITHUB_SHA}\`
          - AionCore ${AIONCORE_VER}: \`${AIONCORE_REV}\`
          - Binaries are **unsigned** in this phase (macOS ad-hoc / Windows unsigned)
          - On macOS, first launch may require Control-clicking the app and choosing **Open**
          - Verify checksums: \`sha256sum -c SHA256SUMS\`
          - Verify attestation: \`gh attestation verify <artifact> --repo ${GITHUB_REPOSITORY}\`
          - Manifest: \`BUILD-MANIFEST.json\`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find release-assets -maxdepth 1 -type f ! -name '.*' | sort)
          test "${#FILES[@]}" -gt 0
          if [ "$GITHUB_REF_TYPE" = 'tag' ]; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file trusted-notes.md \
              --latest \
              "${FILES[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file trusted-notes.md \
              --latest \
              "${FILES[@]}"
          fi
